# ============================================================
# Configuration for exp_model_validation.py
# Model: SiT-L/2  |  straight_weighting_v lam=2.0  |  ImageNet 256
# ============================================================

experiment:
  name: "performance_SiT_L_straight_20_imagenet"
  experiments_base_dir: "./experiment"

checkpoint:
  checkpoint_dir: "./results/SiT-L-2-scaled-Linear-velocity-None-straight_weighting_v-lam2.0-IS256-BS1024-imagenet-pretrained/checkpoints/"
  steps: [115000]
  use_ema: true
  skip_missing: false

model_overrides:
  model: null
  image_size: null
  num_classes: null
  vae: null
  path_type: null
  prediction: null
  loss_weight: null
  sample_eps: null
  train_eps: null

eval:
  num_images: 50000
  batch_size: 256
  fid_batch_size: 256
  fid_chunk_size: 5000
  seed: 42

data:
  ref_data_path: "/scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/Data/CLS-LOC/val"
  num_ref_images: 50000

sampling:
  cfg_scale: [1.0]
  num_sampling_steps: 50
  sampling_method: "euler"
  atol: 1.0e-6
  rtol: 1.0e-3

device: "cuda:0"
