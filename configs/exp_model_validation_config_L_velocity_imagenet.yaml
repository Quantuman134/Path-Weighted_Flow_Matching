# ============================================================
# Configuration for exp_model_validation.py
# Model: SiT-L/2  |  velocity  |  ImageNet 256
# Step grid mirrors exp_model_validation_config_L_vanilla_10_imagenet.yaml
# so the two FID/IS curves are directly comparable. 125000 is absent
# from this checkpoint dir and is dropped via `skip_missing`.
# ============================================================

experiment:
  name: "performance_SiT_L_velocity_imagenet"
  experiments_base_dir: "./experiment"

checkpoint:
  checkpoint_dir: "./results/SiT-L-2-Linear-velocity-None-velocity-IS256-BS1024-imagenet-pretrained/checkpoints/"
  steps: [30000, 50000, 80000, 100000, 125000, 150000, 165000, 200000, 250000, 300000, 350000]
  use_ema: true
  skip_missing: true

model_overrides:
  model: null
  image_size: null
  num_classes: null
  vae: null
  path_type: null
  prediction: null
  loss_weight: null
  sample_eps: null
  train_eps: null

eval:
  num_images: 50000
  batch_size: 256
  fid_batch_size: 256
  fid_chunk_size: 5000
  seed: 42

data:
  ref_data_path: "/scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/Data/CLS-LOC/val"
  num_ref_images: 50000

sampling:
  cfg_scale: [1.0, 1.5]
  num_sampling_steps: 50
  sampling_method: "euler"
  atol: 1.0e-6
  rtol: 1.0e-3

device: "cuda:0"
