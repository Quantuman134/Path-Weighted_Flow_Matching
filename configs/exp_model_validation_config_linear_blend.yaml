# ============================================================
# Configuration for exp_model_validation.py
#
# Model architecture (model, image_size, num_classes, vae,
# path_type, prediction, etc.) is AUTO-LOADED from the
# checkpoint's saved args (ckpt["args"]). You only need to
# fill in model_overrides for fields you want to override.
#
# Usage:
#   # Multi-GPU (recommended for 50k images):
#   torchrun --nproc_per_node=4 exp_model_validation.py \
#       --config configs/exp_model_validation_config.yaml
#
#   # Single-GPU:
#   python exp_model_validation.py \
#       --config configs/exp_model_validation_config.yaml
#
#   # Override device on the fly:
#   python exp_model_validation.py \
#       --config configs/exp_model_validation_config.yaml \
#       --device cuda:1
# ============================================================


# ── Experiment output ─────────────────────────────────────────────────────────
experiment:
  name: "perfromance_DiT_V_linear_blend"        # Results go to {experiments_base_dir}/{name}/
  experiments_base_dir: "./experiment"


# ── Checkpoint settings ───────────────────────────────────────────────────────
checkpoint:
  # Directory containing XXXXXXX.pt checkpoint files
  checkpoint_dir: "./results/SiT-XL-2-Linear-velocity-None-linear_blend-IS256-BS256-pretrained-1M/checkpoints/"

  # List of training steps to evaluate.
  # Each entry must match a file: {checkpoint_dir}/{step:07d}.pt
  # Example: step 100000 → 0100000.pt
  steps: [200000, 400000, 600000, 800000, 1000000]

  # true  → load ckpt["ema"]   (recommended: EMA weights give better FID)
  # false → load ckpt["model"] (raw training weights)
  use_ema: true

  # true  → skip checkpoints whose .pt file is missing (warn and continue)
  # false → raise FileNotFoundError if any step file is missing
  skip_missing: false


# ── Optional model overrides ──────────────────────────────────────────────────
# These override fields from ckpt["args"]. Leave null to use whatever
# was saved in the checkpoint. Useful when the stored args are stale or
# you want to test a different transport prediction type.
#
# Required fields (must be non-null here OR present in ckpt["args"]):
#   model, image_size, num_classes, vae, path_type, prediction
model_overrides:
  model: null          # e.g. "SiT-XL/2", "SiT-L/2", "SiT-B/2", "SiT-S/2"
  image_size: null     # e.g. 256 or 512
  num_classes: null    # e.g. 1000  (ImageNet)
  vae: null            # "ema" or "mse"  (stabilityai/sd-vae-ft-{vae})
  path_type: null      # "Linear", "GVP", or "VP"
  prediction: null     # "velocity", "score", "noise", or "target"
  loss_weight: null    # null, "velocity", or "likelihood"
  sample_eps: null     # null or float  (ODE start time offset)
  train_eps: null      # null or float


# ── Evaluation settings ───────────────────────────────────────────────────────
eval:
  # Number of images to generate per checkpoint.
  # 50000 matches the standard ImageNet FID/IS evaluation protocol.
  # Use a smaller value (e.g. 5000) for quick sanity checks.
  num_images: 50000

  # Generation batch size per GPU.
  # Reduce if you run out of GPU memory during sampling.
  batch_size: 256

  # Batch size for Inception v3 feature extraction (FID and IS).
  # Runs on rank 0's GPU only.
  fid_batch_size: 256

  # Chunk size for converting the gathered uint8 array → float32 before
  # feeding to Inception. Avoids creating a 39 GB float32 tensor for 50k images.
  # Memory estimate for rank 0 at chunk_size=5000, 256×256:
  #   uint8 gathered: ~9.8 GB CPU RAM
  #   float32 chunk:  ~3.9 GB CPU RAM (temporary)
  #   features:       ~0.4 GB CPU RAM
  #   IS probs:       ~0.2 GB CPU RAM
  #   Total peak:     ~14.4 GB CPU RAM
  fid_chunk_size: 5000

  # RNG seed for class labels and per-rank noise.
  # The same seed is used for all checkpoints so FID comparisons are fair:
  # every checkpoint generates images from identical initial noise and labels.
  seed: 42


# ── Reference data (ImageNet val) ────────────────────────────────────────────
data:
  # Path to an ImageFolder-compatible ImageNet validation directory.
  # Example structure: imagenet_val/n01440764/*.JPEG
  imagenet_val_path: "/scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/Data/CLS-LOC/val"

  # Number of reference images to use for FID computation.
  # Standard protocol: 50000 (matches generated image count).
  num_ref_images: 50000


# ── ODE sampling ─────────────────────────────────────────────────────────────
sampling:
  # Classifier-free guidance scale.
  # 1.0 = disabled (unconditional).
  # >1.0 = enabled (typical values: 1.5 – 4.0 for ImageNet).
  cfg_scale: 1.5

  # Number of ODE integration steps (for fixed-step solvers: euler, rk4).
  # Higher = better quality but slower. Typical: 250.
  num_sampling_steps: 50

  # ODE solver: "euler" (fast, fixed-step), "rk4" (higher-order, fixed-step),
  # "dopri5" (adaptive, use with atol/rtol).
  sampling_method: "euler"

  # Tolerances for adaptive solvers (dopri5). Ignored for euler/rk4.
  atol: 1.0e-6
  rtol: 1.0e-3


# ── Device (single-GPU mode only) ────────────────────────────────────────────
# This is used when running with plain `python` (no torchrun).
# When using torchrun, each process uses cuda:{local_rank} automatically.
device: "cuda:0"
