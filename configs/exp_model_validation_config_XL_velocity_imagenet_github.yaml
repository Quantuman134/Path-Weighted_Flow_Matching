# ============================================================
# Configuration for exp_model_validation.py
# Model: SiT-XL/2  |  velocity  |  ImageNet 256  |  GitHub pretrained (7M steps)
# ============================================================

experiment:
  name: "performance_SiT_XL_velocity_imagenet_github"
  experiments_base_dir: "./experiment"

checkpoint:
  checkpoint_dir: "./results/SiT-XL-2-Linear-velocity-None-velocity-IS256-BS256-pretrained-github/checkpoints/"
  steps: [7000000]
  use_ema: false
  skip_missing: true

model_overrides:
  model: "SiT-XL/2"
  image_size: 256
  num_classes: 1000
  vae: "mse"
  path_type: "Linear"
  prediction: "velocity"
  loss_weight: null
  sample_eps: null
  train_eps: null

eval:
  num_images: 50000
  batch_size: 256
  fid_batch_size: 256
  fid_chunk_size: 5000
  seed: 42

data:
  ref_data_path: "/scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/Data/CLS-LOC/val"
  num_ref_images: 50000

sampling:
  cfg_scale: [1.0, 1.5]
  num_sampling_steps: 250
  sampling_method: "dopri5"
  atol: 1.0e-6
  rtol: 1.0e-3

device: "cuda:0"
