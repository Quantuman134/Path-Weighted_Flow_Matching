# ============================================================
# Configuration for exp_true_marginal_wavg.py  (revision v2, 2026-08-03)
#
# Estimate w_avg(T, t) on the analytic class-conditional marginal flow of
# the empirical ImageNet latent distribution, on a fixed interval [0, T]
# with T < 1. No neural velocity model is used; v_c(z, t) is closed form.
#
# See tmp/true_marginal_wavg_required_revisions.html for the derivation
# of every setting below.
# ============================================================

experiment:
  name: "true_marginal_wavg_imagenet_T099_S256"
  seed: 2026

output_dir: "./experiment/true_marginal_wavg_imagenet_T099_S256"
experiments_base_dir: "./experiment"

# ── data ─────────────────────────────────────────────────────────────────
# latent_root  : directory of per-class packed .npy latents produced by
#                encode_dataset.py (mirror of the training input pipeline).
# latent_mode  : one of
#   precomputed_point      -> use posterior mean, no eps, no scale
#                             (treat cached means as fixed target points)
#   posterior_mean         -> use posterior mean, apply latent_scale
#   fixed_posterior_sample -> (mean + std * eps) * latent_scale
#                             with eps deterministically seeded per class
# latent_scale : multiplicative factor applied to y (usually 0.18215 to
#                match the training input pipeline, or 1.0 for raw latents).
data:
  latent_root: "/scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/latents_packed/train"
  data_space: "latent"
  latent_shape: [4, 32, 32]
  latent_dimension: 4096
  latent_mode: "fixed_posterior_sample"
  latent_scale: 0.18215
  num_available_classes: 1000
  num_test_classes: 32                     # C = 32 (4 classes per GPU × 8 GPUs)
  class_selection: "uniform_without_replacement"
  use_all_targets_in_class: true

# ── flow / solver ────────────────────────────────────────────────────────
# terminal_time T is strictly less than 1: this avoids the endpoint
# singularity that produced the discretization artifact in the v1 run.
# The Euler step is  h = T / S,  and reporting times are  s_i * (T / S).
flow:
  target_distribution: "empirical_discrete"
  solver: "euler"
  terminal_time: 0.99
  solver_steps: 256
  # 16 solver-aligned reporting indices spanning [0, S].
  # (equivalently: report_fractions: [0.0, 0.0667, ..., 1.0])
  report_indices: [0, 17, 34, 51, 68, 85, 102, 119, 137,
                   154, 171, 188, 205, 222, 239, 256]

# ── estimator ────────────────────────────────────────────────────────────
estimator:
  samples_per_class: 64                    # N
  probes_per_sample: 64                    # K
  probe_type: "rademacher"
  precision: "fp32"                        # fp32 | fp64
  bootstrap_replicates: 10000

# ── distributed ──────────────────────────────────────────────────────────
distributed:
  world_size: 8
  class_assignment: "round_robin"

# ── logging ──────────────────────────────────────────────────────────────
logging:
  echo_stdout: true
  progress_interval_steps: 8
  jsonl: true
  checkpoint_each_class: true
  profile_latency: true

# ── validation subruns (after the main sweep; rank 0 only) ───────────────
# Set enabled: false to skip validation entirely.
validation:
  enabled: true

  # Solver-convergence at fixed T (revision doc §5.3, §6).
  # Curves at each S are aligned in continuous time before comparison.
  #
  # NOTE: val_N / val_K MUST match the production estimator budget
  # (samples_per_class / probes_per_sample above). Using a smaller budget
  # here makes the S-to-S comparison Monte-Carlo-noise-limited rather than
  # discretization-limited, and produces spurious GATE failures that do
  # not reflect the actual production run.
  solver_steps: [128, 256, 512, 1024]
  num_classes: 4                           # first 4 selected classes only
  val_N: 64                                # = production samples_per_class
  val_K: 64                                # = production probes_per_sample

  # Finite-difference trace-averaged agreement (revision doc §3, §6).
  finite_difference_delta: [1.0e-4, 5.0e-4, 1.0e-3, 5.0e-3]

  # Autograd local VJP validation of J_v^T (revision doc §3).
  # Uses fp64 by default: doc requires rel err < 1e-4 (fp32) / < 1e-8 (fp64).
  autograd_vjp: true
  autograd_vjp_dtype: "fp64"

  # Marginal-moment validation of the integrated flow (revision doc §3).
  marginal_moments: true

# Single-GPU fallback (used only when NOT launched via torchrun).
device: "cuda:0"
