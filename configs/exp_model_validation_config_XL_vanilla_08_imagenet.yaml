# ============================================================
# Configuration for exp_model_validation.py
# Model: SiT-XL/2  |  vanilla_weighting_v lam=0.8  |  ImageNet 256
# Training run 052 (stopped at ~87k).
#
# Requested step grid was [30000, 60000, 90000], but 0090000.pt is
# TRUNCATED (1.5 MB vs 10.8 GB) — the job was killed mid-save, so it
# is unloadable and `skip_missing` will not catch it (the file exists).
# It is therefore left out of `steps` below; add it back once a good
# copy exists. 0080000.pt was kept as the usable late checkpoint and
# can be substituted here.
# ============================================================

experiment:
  name: "performance_SiT_XL_vanilla_08_imagenet"
  experiments_base_dir: "./experiment"

checkpoint:
  checkpoint_dir: "./results/SiT-XL-2-scaled-Linear-velocity-None-vanilla_weighting_v-lam0.8-IS256-BS1024-imagenet/checkpoints/"
  steps: [30000, 60000, 80000]
  use_ema: true
  skip_missing: true

model_overrides:
  model: null
  image_size: null
  num_classes: null
  vae: null
  path_type: null
  prediction: null
  loss_weight: null
  sample_eps: null
  train_eps: null

eval:
  num_images: 50000
  batch_size: 256
  fid_batch_size: 256
  fid_chunk_size: 5000
  seed: 42

data:
  ref_data_path: "/scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/Data/CLS-LOC/val"
  num_ref_images: 50000

sampling:
  cfg_scale: [1.0]
  num_sampling_steps: 50
  sampling_method: "euler"
  atol: 1.0e-6
  rtol: 1.0e-3

device: "cuda:0"
