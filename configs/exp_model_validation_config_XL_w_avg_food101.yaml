# ============================================================
# Configuration for exp_model_validation.py
# Model: SiT-XL/2  |  w_avg weighting  |  Food-101 256
# w(t) = 0.3231 + 2.7003 exp(-3.9094 t)
# Step grid matches the other Food-101 XL runs (velocity, vanilla lam=0.8/1.0)
# so the FID/IS curves are directly comparable.
# ============================================================

experiment:
  name: "performance_SiT_XL_w_avg_food101"
  experiments_base_dir: "./experiment"

checkpoint:
  # train.py prefixes the run directory with a running index (e.g. "053-");
  # exp_model_validation.py resolves it as long as the match is unique.
  # scale_enable is false for w_avg, so there is no "-scaled" in the run name.
  checkpoint_dir: "./results/SiT-XL-2-Linear-velocity-None-w_avg-IS256-BS1024-food101/checkpoints/"
  steps: [20000, 40000, 60000, 80000, 100000, 120000, 140000, 160000, 180000, 200000]
  use_ema: true
  skip_missing: true

model_overrides:
  model: null
  image_size: null
  num_classes: null
  vae: null
  path_type: null
  prediction: null
  loss_weight: null
  sample_eps: null
  train_eps: null

eval:
  num_images: 50000
  batch_size: 256
  fid_batch_size: 256
  fid_chunk_size: 5000
  seed: 42

data:
  # FID / IS reference: the *training* split of this dataset (75,750 images),
  # randomly subsampled to num_ref_images. Both sides of the FID therefore live in
  # the same distribution the model was fit to.
  ref_data_path: "/scratch/project/prj-02-visual-ai/hkzhang/food101/train"
  num_ref_images: 50000

sampling:
  cfg_scale: [1.0]
  num_sampling_steps: 50
  sampling_method: "euler"
  atol: 1.0e-6
  rtol: 1.0e-3

device: "cuda:0"
