# Configuration for SiT Training

# Data Settings
data:
  data_path: /data/hkzhang/imagenet_raw/train  # REQUIRED: Path to training data (ImageFolder format)
  val_data_path: /data/hkzhang/imagenet_raw/val  # Optional: Path to validation data (ImageFolder format)

# Model Settings
model:
  model: 'SiT-XL/2'  # Model architecture: SiT-XL/2, SiT-L/2, SiT-B/2, etc.
  image_size: 256  # Image size: 256 or 512
  num_classes: 1000  # Number of classes in the dataset
  vae: 'ema'  # VAE model: 'ema' or 'mse'

# Transport Settings
transport:
  path_type: 'Linear'  # Path type: 'Linear', 'GVP', or 'VP'
  prediction: 'velocity'  # Prediction type: 'velocity', 'score', or 'noise'
  loss_weight: null  # Loss weight: null, 'velocity', or 'likelihood'
  sample_eps: null  # Optional: Sampling epsilon (float)
  train_eps: null  # Optional: Training epsilon (float)

# Training Settings
training:
  epochs: 1400  # Number of training epochs
  global_batch_size: 64  # Total batch size across all GPUs
  global_seed: 0  # Random seed for reproducibility
  num_workers: 20  # Number of data loading workers (increased for better GPU utilization)

# Logging Settings
logging:
  results_dir: 'results'  # Directory to save results
  log_every: 10  # Log training info every N steps
  ckpt_every: 10000  # Save checkpoint every N steps
  sample_every: 2500  # Generate samples every N steps
  wandb: true  # Enable Weights & Biases logging
  wandb_key: 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  # W&B API key (can also use env var WANDB_KEY)
  wandb_entity: 'TAMU-Visual-AI'  # W&B entity name (can also use env var ENTITY)
  wandb_project: 'SiT'  # W&B project name (can also use env var PROJECT)
  
# Validation Settings
validation:
  val_num_samples: 5000  # Number of samples to use for validation
  val_log_images: 5000  # Number of validation images to log to wandb

# Sampling Settings
sampling:
  cfg_scale: 4.0  # Classifier-free guidance scale

# Checkpoint Settings
checkpoint:
  ckpt: './results/008-SiT-XL-2-Linear-velocity-None/checkpoints/0335000.pt'  # Optional: Path to checkpoint to resume training from
