# Configuration for TM2T (Two-stage: pretrained SiT + TM2T) Training

# Data Settings
data:
  data_path: /data/hkzhang/imagenet_raw/train  # REQUIRED: Path to training data (ImageFolder format)
  val_data_path: /data/hkzhang/imagenet_raw/val  # Optional: Path to validation data (ImageFolder format)

# Model Settings
model:
  model: 'SiT-S/2'  # Architecture for TM2T (should match pretrained model)
  image_size: 64  # Image size: 256 or 512
  num_classes: 1000  # Number of classes in the dataset
  vae: 'ema'  # VAE model: 'ema' or 'mse'

# Transport Settings (shared by both models)
transport:
  path_type: 'Linear'  # Path type: 'Linear', 'GVP', or 'VP'
  prediction: 'target'  # TM2T model prediction type: 'velocity', 'score', 'noise', or 'target'
  pretrained_prediction: 'velocity'  # Pretrained SiT prediction type (must match its checkpoint); defaults to 'prediction' if omitted
  loss_weight: null  # Loss weight: null, 'velocity', or 'likelihood'
  sample_eps: null  # Optional: Sampling epsilon (float)
  train_eps: null  # Optional: Training epsilon (float)

# TM2T-specific Settings
tm2t:
  t_min: 0.3  # The 'm' parameter: TM2T handles t in [t_min, 1]; pretrained SiT handles [0, t_min]
  pretrained_ckpt: './results/SiT-S-2_64_pretrained/checkpoints/0160000.pt'  # REQUIRED: Path to pretrained frozen SiT checkpoint

# Training Settings
training:
  epochs: 1400  # Number of training epochs
  global_batch_size: 2560  # Total batch size across all GPUs
  global_seed: 0  # Random seed for reproducibility
  num_workers: 20  # Number of data loading workers

# Logging Settings
logging:
  results_dir: 'results'  # Directory to save results
  log_every: 100  # Log training info every N steps
  ckpt_every: 50000  # Save checkpoint every N steps
  sample_every: 5000  # Generate samples every N steps
  wandb: true  # Enable Weights & Biases logging
  wandb_key: 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
  wandb_entity: 'TAMU-Visual-AI'
  wandb_project: 'SiT'

# Validation Settings
validation:
  val_num_samples: 5000  # Number of samples to use for validation
  val_log_images: 5000  # Number of validation images to log to wandb

# Sampling Settings
sampling:
  cfg_scale: 4.0  # Classifier-free guidance scale
  num_sampling_steps: 250  # ODE steps split proportionally between stage 1 and stage 2

# Checkpoint Settings
checkpoint:
  ckpt: null  # Optional: Path to TM2T checkpoint to resume training from
