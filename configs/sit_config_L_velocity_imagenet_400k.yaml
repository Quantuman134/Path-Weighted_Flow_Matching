# Configuration for SiT Training -- SiT-L/2, vanilla (unweighted velocity) loss.
# Continues the pretrained ImageNet run to >= 400k steps.
#   resume ckpt : step 200,000 (epoch 159)
#   epochs 330  -> 200,000 + (330-160)*1251 = ~412,670 steps

# Data Settings
data:
  data_path: /scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/Data/CLS-LOC/train
  latent_data_path: /scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/latents/train
  packed_latent_data_path: /scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/latents_packed/train
  val_data_path: /scratch/project/prj-02-visual-ai/hkzhang/ILSVRC/Data/CLS-LOC/val
  dataset_name: imagenet


# Model Settings
model:
  model: 'SiT-L/2'  # Model architecture: SiT-XL/2, SiT-L/2, SiT-B/2, etc.
  image_size: 256  # Image size: 256 or 512
  num_classes: 1000  # Number of classes in the dataset
  vae: 'ema'  # VAE model: 'ema' or 'mse'

# Transport Settings
transport:
  path_type: 'Linear'  # Path type: 'Linear', 'GVP', or 'VP'
  prediction: 'velocity' # Prediction type: 'velocity', 'score', or 'noise'
  loss_weight: null  # Loss weight: null, 'velocity', or 'likelihood'
  loss_space: 'velocity'  # Vanilla / uniform flow-matching baseline: unweighted velocity MSE
  sample_eps: null  # Optional: Sampling epsilon (float)
  train_eps: null  # Optional: Training epsilon (float)
  loss_lambda: 1.0  # Unused for the 'velocity' loss space

# Training Settings
training:
  epochs: 330  # 1251 steps/epoch @ BS1024 -> stops at ~412k steps (>= 400k target)
  global_batch_size: 1024  # Total batch size across all GPUs
  global_seed: 42  # Random seed for reproducibility
  num_workers: 20  # Number of data loading workers
  scale_enable: false  # No loss scaling for the unweighted baseline
  extra_scale: 1.0  # Unit scale (no-op since scale_enable is false)

# Logging Settings
logging:
  results_dir: 'results'  # Directory to save results
  log_every: 10  # Log training info every N steps
  ckpt_every: 10000  # Save checkpoint every N steps
  sample_every: 10000  # Generate samples every N steps
  wandb: true  # Enable Weights & Biases logging
  wandb_key: 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  # W&B API key (can also use env var WANDB_KEY)
  wandb_entity: 'TAMU-Visual-AI'  # W&B entity name (can also use env var ENTITY)
  wandb_project: 'SiT'  # W&B project name (can also use env var PROJECT)

# Validation Settings
validation:
  val_num_samples: 5000  # Number of samples to use for validation
  val_log_images: 256  # Number of validation images to log to wandb

# Sampling Settings
sampling:
  cfg_scale: 1.0  # Classifier-free guidance scale

# Checkpoint Settings
checkpoint:
  ckpt: ./results/SiT-L-2-Linear-velocity-None-velocity-IS256-BS1024-imagenet-pretrained/checkpoints/0200000.pt  # Resume point (step 200,000, epoch 159)
